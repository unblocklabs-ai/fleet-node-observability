[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-node-observability"
dynamic = ["version"]
description = "Node-side observability tooling for OpenClaw fleet hosts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
